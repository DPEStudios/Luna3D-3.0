<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
a{color:#F72FB8;text-decoration:none}a:hover{color:#E81F9D}
.stage{position:fixed;inset:0;overflow:hidden;font-family:'Manrope',sans-serif;background:#070C20;transition:background-color 1.8s cubic-bezier(.45,.05,.25,1)}
.stage.day{background:#EAF2FA}
#stars{position:absolute;inset:0;z-index:0;pointer-events:none;transition:opacity 1.4s cubic-bezier(.45,.05,.25,1),visibility 1.4s}
.day #stars{opacity:0;visibility:hidden}
.bgglow{position:absolute;border-radius:50%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.5;transition:opacity 1.4s ease}
.g-m{width:560px;height:560px;top:-160px;right:-120px;background:radial-gradient(circle,rgba(232,31,157,.55),transparent 68%)}
.g-v{width:640px;height:640px;bottom:-220px;left:-160px;background:radial-gradient(circle,rgba(155,39,224,.5),transparent 68%)}
.day .bgglow{opacity:0}
#shooting-stars{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;transition:opacity 1.2s ease,visibility 1.2s}
.day #shooting-stars{opacity:0;visibility:hidden}
.shooting-star{position:absolute;top:0;left:0;border-radius:99px;background:linear-gradient(90deg,rgba(224,232,255,0) 0%,rgba(224,232,255,.13) 52%,rgba(230,238,255,.46) 100%);box-shadow:0 0 3px rgba(210,224,255,.2);will-change:transform,opacity}
#daysky{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#CFE3F6 0%,#EAF2FA 50%,#FBFAF7 100%);opacity:0;visibility:hidden;transition:opacity 1.8s cubic-bezier(.45,.05,.25,1) .1s,visibility 1.8s .1s}
.day #daysky{opacity:1;visibility:visible;transition:opacity 2.2s cubic-bezier(.45,.05,.25,1) .3s,visibility 2.2s .3s}
.ds-clouds{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.2;filter:blur(1.6px) brightness(1.14) saturate(.55) contrast(.82);transform:scale(1.04)}
.ds-wash{position:absolute;inset:0;background:linear-gradient(180deg,rgba(207,227,246,.5) 0%,rgba(234,242,250,.5) 48%,rgba(251,250,247,.6) 100%)}
.ds-sunglow{position:absolute;top:-160px;right:-140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(244,212,136,.4) 0%,rgba(244,212,136,.12) 50%,transparent 72%);filter:blur(18px)}
.ds-moon{position:absolute;top:11%;left:7%;width:116px;height:116px;opacity:.32;mix-blend-mode:soft-light;filter:drop-shadow(0 0 26px rgba(255,255,255,.5));animation:ds-moonfloat 26s cubic-bezier(.22,.61,.36,1) infinite}
@keyframes ds-moonfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.ds-birdcanvas{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:blur(.35px);opacity:.55}
.src-video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px;top:-10px}
.hero{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:24px}
.kicker{font-family:'Space Mono','Space Grotesk',monospace;letter-spacing:.42em;font-size:13px;text-transform:uppercase;color:#F72FB8;margin-bottom:18px}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(48px,9vw,120px);line-height:.98;letter-spacing:-.02em;color:#F5F6FB}
.day .kicker{color:#B12CD9}
.day .hero h1{color:#0B1437}
.hero p{margin-top:20px;font-size:16px;max-width:440px;color:#8A93B6}
.day .hero p{color:#5C6B94}
.toggle{position:absolute;z-index:5;top:22px;right:22px;display:flex;align-items:center;gap:9px;padding:9px 16px 9px 12px;border-radius:99px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:13px;letter-spacing:.02em;color:#F5F6FB;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);transition:background-color 1.2s ease,color 1.2s ease,border-color 1.2s ease}
.toggle:hover{background:rgba(255,255,255,.11)}
.day .toggle{color:#0B1437;background:rgba(11,20,55,.05);border-color:rgba(11,20,55,.14)}
.day .toggle:hover{background:rgba(11,20,55,.09)}
.toggle .dot{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C4C9DE);box-shadow:0 0 10px rgba(245,246,251,.6)}
.day .toggle .dot{background:radial-gradient(circle at 35% 30%,#FFF4CE,#F4D488);box-shadow:0 0 12px rgba(244,212,136,.7)}
@media (prefers-reduced-motion:reduce){.ds-birdvid{display:none}}
</style></helmet><div class="stage {{mode}}" data-screen-label="Luna cielo"><canvas id="stars"></canvas><div class="bgglow g-m"></div><div class="bgglow g-v"></div><div id="shooting-stars"></div><div id="daysky"><video id="cloudvid" class="ds-clouds" muted loop playsinline preload="none"><source src="assets/clouds.mp4" type="video/mp4"></video><div class="ds-wash"></div><div class="ds-sunglow"></div><svg class="ds-moon" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.6)"></circle><circle cx="38" cy="34" r="7" fill="rgba(178,193,219,.32)"></circle><circle cx="61" cy="56" r="9" fill="rgba(178,193,219,.26)"></circle><circle cx="44" cy="68" r="5" fill="rgba(178,193,219,.3)"></circle><circle cx="66" cy="32" r="4.5" fill="rgba(178,193,219,.24)"></circle></svg><canvas id="birdcanvas" class="ds-birdcanvas"></canvas><video id="birdvid" class="src-video" muted loop playsinline preload="none"><source src="assets/birds.mp4" type="video/mp4"></video></div><div class="hero"><div class="kicker">Luna3D</div><h1>Impresión que<br>ilumina</h1><p>Usa el interruptor de arriba para alternar entre la noche estrellada y el cielo diurno.</p></div><button class="toggle" onClick="{{toggle}}"><span class="dot"></span>{{toggleLabel}}</button></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { day: false };

  renderVals() {
    return {
      mode: this.state.day ? 'day' : '',
      toggleLabel: this.state.day ? 'Modo noche' : 'Modo día',
      toggle: () => this.setState(s => ({ day: !s.day })),
    };
  }

  componentDidMount() {
    this.reduce = matchMedia('(prefers-reduced-motion: reduce)');
    this.initStars();
    this.buildShootingStars();
    this.buildBirds();
    this.syncSky();
  }

  componentDidUpdate() { this.syncSky(); }

  componentWillUnmount() {
    this.stars && this.stars.destroy();
    this.shoot && this.shoot.stop();
    this.birds && this.birds.stop();
  }

  /* ---------- BANDADA DIURNA (video real, verde recortado en canvas) ---------- */
  buildBirds() {
    const video = document.getElementById('birdvid');
    const cv = document.getElementById('birdcanvas');
    if (!video || !cv) return;
    const PW = 1280, PH = 720;
    cv.width = PW; cv.height = PH;
    video.loop = true; video.muted = true; video.playsInline = true;
    video.playbackRate = 1.35;                 // aleteo relajado en vez de tanto planeo
    const ctx = cv.getContext('2d');
    // buffer donde se recorta el verde del video (fuente de aleteo real), una vez por frame
    const OW = 480, OH = 270;
    const buf = document.createElement('canvas'); buf.width = OW; buf.height = OH;
    const bctx = buf.getContext('2d', { willReadFrequently: true });
    const rand = (a, b) => a + Math.random() * (b - a);
    let raf = null, timer = null, sprites = [];
    const canPlay = () => this.state.day && !this.reduce.matches && document.visibilityState === 'visible';
    const keyFrame = () => {
      if (video.ended || (video.duration && video.currentTime >= video.duration - 0.05)) { video.currentTime = 0; video.play().catch(() => {}); }
      if (video.readyState < 2) return;
      bctx.drawImage(video, 0, 0, OW, OH);
      const img = bctx.getImageData(0, 0, OW, OH), d = img.data;
      for (let p = 0; p < d.length; p += 4) {
        const r = d[p], g = d[p + 1], b = d[p + 2];
        if (g > 90 && g > r * 1.25 && g > b * 1.25) { d[p + 3] = 0; }
        else { const luma = (r + g + b) / 3, cover = Math.max(0, Math.min(1, 1 - luma / 150)); d[p] = 45; d[p + 1] = 62; d[p + 2] = 98; d[p + 3] = Math.round(255 * cover); }
      }
      bctx.putImageData(img, 0, 0);
    };
    // un pájaro/manada que cruza la pantalla, pequeño y en ángulo de caída
    const spawn = () => {
      if (!canPlay()) return;
      const dir = Math.random() < 0.5 ? 1 : -1;
      const solo = Math.random() < 0.42;
      const w = solo ? rand(24, 44) : rand(60, 118);          // pequeños, a lo lejos
      const cropW = solo ? OW * rand(0.16, 0.26) : OW;
      const cropX = solo ? rand(0, OW - cropW) : 0;
      const h = w * (OH / cropW);
      const y0 = rand(0.04, 0.5) * PH;
      const angle = rand(4, 22) * Math.PI / 180;              // distintos ángulos de caída
      const dist = PW + 300;
      const drift = Math.tan(angle) * dist * (Math.random() < 0.12 ? -0.4 : 1); // casi siempre cae
      const x0 = dir === 1 ? -w - 60 : PW + w + 60;
      const x1 = dir === 1 ? PW + w + 60 : -w - 60;
      const speed = rand(95, 165);
      sprites.push({ x0, x1, y0, drift, w, h, cropX, cropW, dir, born: performance.now(), dur: dist / speed * 1000, wob: rand(4, 14), wsp: rand(0.5, 1.3) });
    };
    const draw = () => {
      raf = null;
      if (!this.state.day || this.reduce.matches) return;
      ctx.clearRect(0, 0, PW, PH);
      if (sprites.length) {
        keyFrame();
        const now = performance.now();
        sprites = sprites.filter(s => {
          const p = (now - s.born) / s.dur;
          if (p >= 1) return false;
          const x = s.x0 + (s.x1 - s.x0) * p;
          const y = s.y0 + s.drift * p + Math.sin(p * Math.PI * 2 * s.wsp) * s.wob;
          const alpha = Math.max(0, Math.min(1, Math.min(p, 1 - p) * 8)) * 0.9;
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(x, y);
          if (s.dir === -1) ctx.scale(-1, 1);
          ctx.drawImage(buf, s.cropX, 0, s.cropW, OH, -s.w / 2, -s.h / 2, s.w, s.h);
          ctx.restore();
          return true;
        });
      }
      raf = requestAnimationFrame(draw);
    };
    const scheduleLoop = () => {
      if (!canPlay()) return;
      spawn();
      if (Math.random() < 0.28) setTimeout(spawn, rand(500, 1600));   // a veces un segundo grupo
      timer = setTimeout(scheduleLoop, rand(6500, 14000));            // poco frecuentes, no protagonistas
    };
    this.birds = {
      start: () => {
        if (this.reduce.matches) return;
        if (video.preload === 'none') video.preload = 'auto';
        video.play().catch(() => {});
        if (!raf) raf = requestAnimationFrame(draw);
        clearTimeout(timer); timer = setTimeout(scheduleLoop, rand(1500, 3500));
      },
      stop: () => { clearTimeout(timer); if (raf) { cancelAnimationFrame(raf); raf = null; } sprites = []; video.pause(); ctx.clearRect(0, 0, PW, PH); },
    };
  }

  // arranca/pausa efectos según el modo (equivalente a setTheme en el sitio real)
  syncSky() {
    const cloud = document.getElementById('cloudvid');
    if (this.state.day) {
      this.stars && this.stars.stop();
      this.shoot && this.shoot.stop();
      if (cloud) { cloud.loop = true; cloud.muted = true; if (cloud.preload === 'none') cloud.preload = 'auto'; if (cloud.ended) cloud.currentTime = 0; cloud.play().catch(() => {}); }
      this.birds && this.birds.start();
    } else {
      this.stars && this.stars.start();
      this.shoot && this.shoot.start();
      cloud && cloud.pause();
      this.birds && this.birds.stop();
    }
  }

  /* ---------- CAMPO DE ESTRELLAS + CONSTELACIONES ---------- */
  initStars() {
    const c = document.getElementById('stars'); if (!c) return;
    const ctx = c.getContext('2d');
    const reduce = this.reduce.matches;
    let w, h, dpr, stars = [], links = [], raf;
    const build = () => {
      dpr = Math.min(devicePixelRatio || 1, 2);
      w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
      c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
      const count = Math.round((innerWidth * innerHeight) / 9000);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: (Math.random() * 1.3 + .3) * dpr, a: Math.random() * .6 + .2,
        tw: Math.random() * Math.PI * 2, sp: Math.random() * .015 + .004,
        bright: Math.random() < .06,
      }));
      links = Array.from({ length: Math.round(count * .10) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - .5) * .12 * dpr, vy: (Math.random() - .5) * .12 * dpr,
      }));
    };
    const frame = () => {
      ctx.clearRect(0, 0, w, h);
      for (const n of links) { n.x += n.vx; n.y += n.vy; if (n.x < 0 || n.x > w) n.vx *= -1; if (n.y < 0 || n.y > h) n.vy *= -1; }
      const maxd = 150 * dpr;
      for (let i = 0; i < links.length; i++) for (let j = i + 1; j < links.length; j++) {
        const a = links[i], b = links[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
        if (d < maxd) { const o = (1 - d / maxd) * .16; ctx.strokeStyle = `rgba(232,31,157,${o})`; ctx.lineWidth = dpr * .6; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      }
      for (const n of links) { ctx.fillStyle = 'rgba(177,44,217,.5)'; ctx.beginPath(); ctx.arc(n.x, n.y, 1.3 * dpr, 0, 7); ctx.fill(); }
      for (const s of stars) { if (!reduce) s.tw += s.sp; const a = s.a * (0.6 + 0.4 * Math.sin(s.tw)); ctx.fillStyle = s.bright ? `rgba(247,47,184,${a})` : `rgba(245,246,251,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
      if (!reduce) raf = requestAnimationFrame(frame);
    };
    build(); frame();
    const onResize = () => { clearTimeout(this._to); this._to = setTimeout(() => { cancelAnimationFrame(raf); build(); frame(); }, 180); };
    addEventListener('resize', onResize);
    this.stars = {
      start: () => { cancelAnimationFrame(raf); if (!reduce) frame(); },
      stop: () => cancelAnimationFrame(raf),
      destroy: () => { cancelAnimationFrame(raf); removeEventListener('resize', onResize); },
    };
  }

  /* ---------- ESTRELLAS FUGACES (modo noche) ---------- */
  buildShootingStars() {
    const layer = document.getElementById('shooting-stars'); if (!layer) return;
    const reduce = this.reduce;
    const rand = (a, b) => a + Math.random() * (b - a);
    const canPlay = () => !this.state.day && !reduce.matches && document.visibilityState === 'visible';
    let timer;
    const spawn = () => {
      if (!canPlay()) return;
      const star = document.createElement('span');
      star.className = 'shooting-star';
      const fallRight = Math.random() < 0.5;                 // izq→der o der→izq, siempre en caída
      const angleDeg = fallRight ? rand(30, 62) : rand(118, 150);
      const angle = angleDeg * Math.PI / 180;
      const distance = rand(300, 560);
      const dx = Math.cos(angle) * distance, dy = Math.sin(angle) * distance;
      const startX = (fallRight ? rand(-0.05, 0.55) : rand(0.45, 1.05)) * innerWidth;
      const startY = rand(-0.04, 0.38) * innerHeight;
      const len = rand(70, 140);
      const thick = rand(0.8, 1.5);
      const peak = rand(0.28, 0.5);                           // sutil, sin destello
      const duration = rand(900, 1750);                       // misma velocidad
      star.style.left = startX + 'px'; star.style.top = startY + 'px';
      star.style.width = len + 'px'; star.style.height = thick + 'px';
      star.style.transform = `translate(0,0) rotate(${angleDeg}deg)`;
      layer.appendChild(star);
      const anim = star.animate([
        { transform: `translate(0,0) rotate(${angleDeg}deg) scaleX(0)`, opacity: 0 },
        { transform: `translate(${dx * 0.16}px,${dy * 0.16}px) rotate(${angleDeg}deg) scaleX(1)`, opacity: peak, offset: 0.12 },
        { transform: `translate(${dx * 0.7}px,${dy * 0.7}px) rotate(${angleDeg}deg) scaleX(1)`, opacity: peak * 0.85, offset: 0.7 },
        { transform: `translate(${dx}px,${dy}px) rotate(${angleDeg}deg) scaleX(0)`, opacity: 0 },
      ], { duration, easing: 'cubic-bezier(.25,.6,.3,1)' });
      anim.onfinish = () => star.remove();
    };
    const loop = () => { spawn(); if (Math.random() < 0.24) setTimeout(spawn, rand(280, 620)); timer = setTimeout(loop, rand(2600, 5200)); };
    const start = () => { clearTimeout(timer); if (canPlay()) timer = setTimeout(loop, rand(600, 1800)); };
    const stop = () => { clearTimeout(timer); layer.querySelectorAll('.shooting-star').forEach(s => s.remove()); };
    start();
    document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' ? start() : stop());
    this.shoot = { start, stop };
  }
}
</script>
</body>
</html>
